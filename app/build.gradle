plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.edencheats'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.edencheats"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assina com a chave de debug para que o APK seja instalável direto.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
